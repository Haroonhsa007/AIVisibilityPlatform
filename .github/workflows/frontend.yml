name: Frontend
on:
  push:
    paths: ["frontend/**", "Context/api-contract/**", "docker-compose.yml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "Context/api-contract/**", "docker-compose.yml", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run build -- --configuration production
      - run: docker build -t ai-visibility-frontend:ci .
