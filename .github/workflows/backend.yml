name: Backend
on:
  push:
    paths: ["backend/**", "docs/api/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/api/**", "docker-compose.yml", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: fake
      PIPELINE_EXECUTION: eager
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-fail-under=85
      - run: docker build -t ai-visibility-backend:ci .
