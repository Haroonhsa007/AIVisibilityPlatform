name: Compose integration
on:
  push:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/compose.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/compose.yml"]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: bash backend/scripts/smoke.sh
        env:
          BASE_URL: http://127.0.0.1:4200
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up CI containers
        if: always()
        run: docker compose down -v
